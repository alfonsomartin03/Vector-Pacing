[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-pacing"
version = "1.0.0"
description = "Cycling pacing simulator and optimizer (model estimates, not validated predictions)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["vector_pacing*"]

[tool.setuptools.package-data]
vector_pacing = ["data/*.gpx"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ′, θ, η etc. in docs/messages

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["vector_pacing"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
